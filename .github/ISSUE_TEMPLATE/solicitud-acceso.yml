name: Solicitud de acceso
description: Pedir acceso a una versión privada de Teleasistencia.
title: "[Acceso] teleasistencia"
labels: ["solicitud-acceso"]
body:
  - type: markdown
    attributes:
      value: |
        Este formulario pide acceso a una versión privada de **Teleasistencia**.
        La primera versión (`teleAsistenciaV1.1`) es pública y gratuita.
  - type: dropdown
    id: version
    attributes:
      label: Versión solicitada
      options:
        - "teleAsistenciaV1.2"
        - "teleAsistenciaV1.2-fix4"
        - "teleAsistenciaV1.2-fix5"
        - "teleAsistenciaV1.3"
        - "teleasistencia"
    validations:
      required: true
  - type: input
    id: uso
    attributes:
      label: Tipo de uso
      description: Personal, educativo, comercial, interno, etc.
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Contame qué querés construir, para qué y por qué necesitás esta versión.
    validations:
      required: true
  - type: checkboxes
    id: condiciones
    attributes:
      label: Condiciones
      options:
        - label: Entiendo que esta versión es privada, que no se redistribuye y que el acceso se otorga por autorización escrita.
          required: true
